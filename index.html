<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tsagame</title>
  <meta name="description" content="tsagame — a game in the making, built with Godot.">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #0b0f17;
      --panel: #121826;
      --line: #1e293b;
      --text: #e6edf7;
      --muted: #94a3b8;
      --accent: #5eead4;
      --accent-2: #818cf8;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(60vw 60vw at 15% 10%, rgba(129, 140, 248, 0.18), transparent 60%),
        radial-gradient(50vw 50vw at 85% 90%, rgba(94, 234, 212, 0.14), transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(680px, 100%);
      background: color-mix(in srgb, var(--panel) 88%, transparent);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 48px 40px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px);
    }

    .logo {
      width: 84px;
      height: 84px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(94, 234, 212, 0.16), rgba(129, 140, 248, 0.16));
      border: 1px solid var(--line);
    }

    .logo img { width: 52px; height: 52px; }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3rem);
      letter-spacing: -0.03em;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .tagline {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 24px;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(94, 234, 212, 0.08);
      color: var(--accent);
      font-size: 0.85rem;
      letter-spacing: 0.02em;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 0 rgba(94, 234, 212, 0.6);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(94, 234, 212, 0.5); }
      70%  { box-shadow: 0 0 0 10px rgba(94, 234, 212, 0); }
      100% { box-shadow: 0 0 0 0 rgba(94, 234, 212, 0); }
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 32px;
    }

    .btn {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .btn:hover { transform: translateY(-1px); border-color: var(--accent); }

    .btn.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #06121a;
      border-color: transparent;
    }

    .btn.disabled {
      color: var(--muted);
      cursor: not-allowed;
      opacity: 0.6;
    }

    .btn.disabled:hover { transform: none; border-color: var(--line); }

    footer {
      margin-top: 36px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.82rem;
    }

    footer a { color: var(--muted); }

    @media (max-width: 480px) {
      main { padding: 36px 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; }
      .btn { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">
      <img src="./icon.svg" alt="tsagame logo">
    </div>

    <h1>tsagame</h1>
    <p class="tagline">A game in the making, built with Godot.</p>

    <div class="status">
      <span class="dot" aria-hidden="true"></span>
      In development
    </div>

    <div class="actions">
      <span class="btn primary disabled" aria-disabled="true">Play — coming soon</span>
      <a class="btn" href="https://github.com/reteshmani0-droid/tsagame">View source on GitHub</a>
    </div>

    <footer>
      Made with <a href="https://godotengine.org">Godot&nbsp;4</a>
    </footer>
  </main>
</body>
</html>
